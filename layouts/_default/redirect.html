{{ define "main" }}
<div class="flex flex-col items-center justify-center py-20">
  <h1 class="text-2xl font-bold">Checking service availability...</h1>
  <p class="mt-4 text-neutral-500">
    Redirecting if the service is available.
  </p>
</div>

<script>
const target = "{{ .Params.target }}";

function go404() {
  window.location.href = "/links/404";
}

const timeout = setTimeout(go404, 4000);

const img = new Image();

img.onload = function () {
  clearTimeout(timeout);
  window.location.href = target;
};

img.onerror = function () {
  clearTimeout(timeout);
  go404();
};

img.src = target + "/favicon.ico?check=" + Date.now();
</script>
{{ end }}
